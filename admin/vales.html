<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vales | Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
      <h1 class="page-title">Gestión de vales</h1>
      <p class="page-subtitle">Revisa, edita, aprueba o rechaza los vales enviados por los gestores.</p>

      <div id="alert-box"></div>

      <div class="tabs" id="tabs">
        <button class="tab-btn active" data-status="sent">Pendientes de aprobación</button>
        <button class="tab-btn" data-status="approved">Aprobados</button>
        <button class="tab-btn" data-status="completed">Completados</button>
        <button class="tab-btn" data-status="rejected">Rechazados</button>
      </div>

      <div class="card">
        <table>
          <thead>
            <tr>
              <th>Vale</th>
              <th>Gestor</th>
              <th>Cliente</th>
              <th>Total</th>
              <th>Entrega</th>
              <th>Fecha</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="vales-body">
            <tr><td colspan="7" class="empty-hint">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Modal: ver / editar vale -->
  <div id="modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); align-items:center; justify-content:center; z-index:50; padding:1rem;">
    <div class="card" style="max-width:560px; width:100%; max-height:85vh; overflow-y:auto;">
      <h3 style="margin-top:0" id="modal-title">Detalle del vale</h3>
      <div id="modal-alert"></div>

      <div id="modal-items"></div>

      <hr style="border-color:var(--border); margin:1rem 0" />

      <div class="field">
        <label for="edit-name">Nombre del cliente</label>
        <input type="text" id="edit-name" />
      </div>
      <div class="field-row">
        <div class="field">
          <label for="edit-phone">Teléfono</label>
          <input type="text" id="edit-phone" />
        </div>
        <div class="field">
          <label for="edit-delivery">Entrega</label>
          <select id="edit-delivery">
            <option value="pickup">Recogida</option>
            <option value="delivery">Envío</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="edit-address">Dirección</label>
        <input type="text" id="edit-address" />
      </div>
      <div class="field">
        <label for="edit-notes">Notas</label>
        <textarea id="edit-notes" rows="2"></textarea>
      </div>

      <div id="reject-reason-wrap" class="field" style="display:none">
        <label for="reject-reason">Motivo de rechazo</label>
        <textarea id="reject-reason" rows="2" placeholder="Explica por qué se rechaza este vale"></textarea>
      </div>

      <div style="display:flex; gap:0.5rem; flex-wrap:wrap; margin-top:1rem;">
        <button class="btn btn-outline btn-sm" id="btn-save-edit" type="button">Guardar cambios</button>
        <button class="btn btn-success btn-sm" id="btn-approve" type="button">Aprobar</button>
        <button class="btn btn-danger btn-sm" id="btn-reject" type="button">Rechazar</button>
        <button class="btn btn-outline btn-sm" id="btn-complete" type="button">Marcar como completado</button>
        <button class="btn btn-outline btn-sm" id="btn-close-modal" type="button">Cerrar</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { requireRole } from "../js/auth.js";
    import { supabase } from "../js/supabase-client.js";
    import { renderSidebar, formatMoney, formatDate, statusBadge, showAlert, escapeHtml, clearAlert } from "../js/layout.js";

    let currentTab = "sent";
    let currentValeId = null;
    let currentValeStatus = null;

    (async () => {
      let profile;
      try {
        ({ profile } = await requireRole(["admin"]));
      } catch {
        return;
      }

      renderSidebar(profile, "vales");
      await loadVales();

      document.querySelectorAll("#tabs .tab-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("#tabs .tab-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          currentTab = btn.dataset.status;
          loadVales();
        });
      });

      document.getElementById("btn-close-modal").addEventListener("click", closeModal);
      document.getElementById("btn-save-edit").addEventListener("click", guardarEdicion);
      document.getElementById("btn-approve").addEventListener("click", aprobarVale);
      document.getElementById("btn-reject").addEventListener("click", rechazarVale);
      document.getElementById("btn-complete").addEventListener("click", completarVale);
    })();

    async function loadVales() {
      const tbody = document.getElementById("vales-body");
      tbody.innerHTML = `<tr><td colspan="7" class="empty-hint">Cargando...</td></tr>`;

      const { data, error } = await supabase
        .from("vales")
        .select("*, gestores(id, profiles(full_name))")
        .eq("status", currentTab)
        .order("created_at", { ascending: false });

      if (error) {
        showAlert("alert-box", "No se pudieron cargar los vales: " + error.message);
        return;
      }

      if (!data || !data.length) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty-hint">No hay vales en esta vista.</td></tr>`;
        return;
      }

      tbody.innerHTML = data
        .map(
          (v) => `
          <tr>
            <td>${v.vale_number}</td>
            <td>${escapeHtml(v.gestores?.profiles?.full_name || "—")}</td>
            <td>${escapeHtml(v.customer_name)}</td>
            <td>${formatMoney(v.total_amount)}</td>
            <td>${v.delivery_method === "delivery" ? "Envío" : "Recogida"}</td>
            <td>${formatDate(v.created_at)}</td>
            <td><button class="btn btn-outline btn-sm" data-open="${v.id}" type="button">Ver / editar</button></td>
          </tr>`
        )
        .join("");

      tbody.querySelectorAll("[data-open]").forEach((btn) => {
        btn.addEventListener("click", () => abrirModal(Number(btn.dataset.open)));
      });
    }

    async function abrirModal(valeId) {
      clearAlert("modal-alert");
      const { data: vale, error } = await supabase
        .from("vales")
        .select("*, gestores(id, profiles(full_name))")
        .eq("id", valeId)
        .single();

      if (error) {
        showAlert("alert-box", "No se pudo abrir el vale: " + error.message);
        return;
      }

      const { data: items } = await supabase.from("vale_items").select("*").eq("vale_id", valeId);

      currentValeId = vale.id;
      currentValeStatus = vale.status;

      document.getElementById("modal-title").textContent = `Vale ${vale.vale_number} — ${vale.gestores?.profiles?.full_name || ""}`;
      document.getElementById("edit-name").value = vale.customer_name || "";
      document.getElementById("edit-phone").value = vale.customer_phone || "";
      document.getElementById("edit-delivery").value = vale.delivery_method;
      document.getElementById("edit-address").value = vale.customer_address || "";
      document.getElementById("edit-notes").value = vale.notes || "";

      document.getElementById("modal-items").innerHTML = `
        <h4 style="margin:0 0 0.5rem">Productos</h4>
        <table>
          <thead><tr><th>Producto</th><th>Cant.</th><th>Precio</th><th>Comisión gestor</th></tr></thead>
          <tbody>
            ${(items || [])
              .map(
                (it) => `<tr>
                  <td>${escapeHtml(it.product_name)}</td>
                  <td>${it.quantity}</td>
                  <td>${formatMoney(it.unit_price)}</td>
                  <td>${formatMoney(it.commission_amount)}</td>
                </tr>`
              )
              .join("")}
          </tbody>
        </table>
        <p style="text-align:right; font-weight:700; margin-top:0.6rem;">Total: ${formatMoney(vale.total_amount)}</p>
        <p>${statusBadge(vale.status)}</p>
      `;

      // Habilitar/deshabilitar acciones según el estado
      const isSent = vale.status === "sent";
      const isApproved = vale.status === "approved";

      document.getElementById("btn-save-edit").style.display = isSent ? "inline-flex" : "none";
      document.getElementById("btn-approve").style.display = isSent ? "inline-flex" : "none";
      document.getElementById("btn-reject").style.display = isSent ? "inline-flex" : "none";
      document.getElementById("btn-complete").style.display = isApproved ? "inline-flex" : "none";
      document.getElementById("reject-reason-wrap").style.display = "none";

      const editable = isSent;
      ["edit-name", "edit-phone", "edit-delivery", "edit-address", "edit-notes"].forEach((id) => {
        document.getElementById(id).disabled = !editable;
      });

      document.getElementById("modal-overlay").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("modal-overlay").style.display = "none";
      document.getElementById("reject-reason-wrap").style.display = "none";
      currentValeId = null;
    }

    async function guardarEdicion() {
      clearAlert("modal-alert");
      try {
        const { error } = await supabase
          .from("vales")
          .update({
            customer_name: document.getElementById("edit-name").value.trim(),
            customer_phone: document.getElementById("edit-phone").value.trim(),
            delivery_method: document.getElementById("edit-delivery").value,
            customer_address: document.getElementById("edit-address").value.trim() || null,
            notes: document.getElementById("edit-notes").value.trim() || null,
          })
          .eq("id", currentValeId);

        if (error) throw error;
        showAlert("modal-alert", "Cambios guardados.", "success");
        loadVales();
      } catch (err) {
        showAlert("modal-alert", "No se pudo guardar: " + err.message);
      }
    }

    async function aprobarVale() {
      clearAlert("modal-alert");
      try {
        const { error } = await supabase.rpc("approve_vale", { p_vale_id: currentValeId });
        if (error) throw error;
        closeModal();
        loadVales();
      } catch (err) {
        showAlert("modal-alert", "No se pudo aprobar: " + err.message);
      }
    }

    function rechazarVale() {
      const wrap = document.getElementById("reject-reason-wrap");
      if (wrap.style.display === "none") {
        wrap.style.display = "flex";
        return;
      }

      const reason = document.getElementById("reject-reason").value.trim();
      if (!reason) {
        showAlert("modal-alert", "Escribe un motivo de rechazo.");
        return;
      }

      confirmarRechazo(reason);
    }

    async function confirmarRechazo(reason) {
      clearAlert("modal-alert");
      try {
        const { error } = await supabase.rpc("reject_vale", { p_vale_id: currentValeId, p_reason: reason });
        if (error) throw error;
        closeModal();
        loadVales();
      } catch (err) {
        showAlert("modal-alert", "No se pudo rechazar: " + err.message);
      }
    }

    async function completarVale() {
      clearAlert("modal-alert");
      try {
        const { error } = await supabase.rpc("complete_vale", { p_vale_id: currentValeId });
        if (error) throw error;
        closeModal();
        loadVales();
      } catch (err) {
        showAlert("modal-alert", "No se pudo completar: " + err.message);
      }
    }
  </script>
</body>
</html>
