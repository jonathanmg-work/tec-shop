<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
      <h1 class="page-title">Panel general</h1>
      <p class="page-subtitle">Vista rápida de todo el sistema.</p>

      <div id="alert-box"></div>

      <div class="stat-grid" id="stat-grid">
        <div class="stat-card"><div class="value">—</div><div class="label">Vales pendientes de aprobación</div></div>
        <div class="stat-card"><div class="value">—</div><div class="label">Ventas aprobadas (total)</div></div>
        <div class="stat-card"><div class="value">—</div><div class="label">Comisiones pendientes de pago</div></div>
        <div class="stat-card"><div class="value">—</div><div class="label">Gestores activos</div></div>
        <div class="stat-card"><div class="value">—</div><div class="label">Líderes activos</div></div>
        <div class="stat-card"><div class="value">—</div><div class="label">Cuentas pendientes de aprobación</div></div>
      </div>

      <div class="card">
        <h3 style="margin-top:0">Accesos rápidos</h3>
        <div style="display:flex; gap:0.6rem; flex-wrap:wrap;">
          <a href="vales.html" class="btn btn-primary">Revisar vales pendientes</a>
          <a href="pagos.html" class="btn btn-outline">Ver pagos semanales</a>
          <a href="usuarios.html" class="btn btn-outline">Aprobar cuentas nuevas</a>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { requireRole } from "../js/auth.js";
    import { supabase } from "../js/supabase-client.js";
    import { renderSidebar, formatMoney, showAlert } from "../js/layout.js";

    (async () => {
      let profile;
      try {
        ({ profile } = await requireRole(["admin"]));
      } catch {
        return;
      }

      renderSidebar(profile, "dashboard");

      try {
        const [
          { count: pendientes },
          { data: aprobados },
          { data: comisiones },
          { count: gestoresActivos },
          { count: lideresActivos },
          { count: cuentasPendientes },
        ] = await Promise.all([
          supabase.from("vales").select("id", { count: "exact", head: true }).eq("status", "sent"),
          supabase.from("vales").select("total_amount").in("status", ["approved", "completed"]),
          supabase.from("commissions").select("gestor_commission, leader_commission, status").eq("status", "pending"),
          supabase
            .from("profiles")
            .select("id", { count: "exact", head: true })
            .eq("role", "gestor")
            .eq("status", "active"),
          supabase
            .from("profiles")
            .select("id", { count: "exact", head: true })
            .eq("role", "leader")
            .eq("status", "active"),
          supabase.from("profiles").select("id", { count: "exact", head: true }).eq("status", "pending_approval"),
        ]);

        const totalVentas = (aprobados || []).reduce((s, v) => s + Number(v.total_amount), 0);
        const totalComisiones = (comisiones || []).reduce(
          (s, c) => s + Number(c.gestor_commission) + Number(c.leader_commission),
          0
        );

        const cards = document.querySelectorAll("#stat-grid .stat-card .value");
        cards[0].textContent = pendientes ?? 0;
        cards[1].textContent = formatMoney(totalVentas);
        cards[2].textContent = formatMoney(totalComisiones);
        cards[3].textContent = gestoresActivos ?? 0;
        cards[4].textContent = lideresActivos ?? 0;
        cards[5].textContent = cuentasPendientes ?? 0;
      } catch (err) {
        showAlert("alert-box", "No se pudo cargar el panel: " + err.message);
      }
    })();
  </script>
</body>
</html>
