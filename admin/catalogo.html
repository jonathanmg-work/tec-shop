<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo | Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
      <h1 class="page-title">Catálogo de gestores</h1>
      <p class="page-subtitle">Productos que los gestores pueden vender, con su comisión. Es independiente del catálogo de la tienda online.</p>

      <div id="alert-box"></div>

      <div class="card" style="margin-bottom:1.2rem;">
        <h3 style="margin-top:0" id="form-title">Nuevo producto</h3>
        <input type="hidden" id="edit-id" />

        <div class="field-row">
          <div class="field">
            <label for="p-name">Nombre</label>
            <input type="text" id="p-name" />
          </div>
          <div class="field">
            <label for="p-price">Precio</label>
            <input type="number" id="p-price" step="0.01" min="0" />
          </div>
        </div>

        <div class="field">
          <label for="p-description">Descripción</label>
          <textarea id="p-description" rows="2"></textarea>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="p-commission-type">Tipo de comisión</label>
            <select id="p-commission-type">
              <option value="percent">Porcentaje (%)</option>
              <option value="fixed">Monto fijo ($)</option>
            </select>
          </div>
          <div class="field">
            <label for="p-commission-value">Valor de comisión</label>
            <input type="number" id="p-commission-value" step="0.01" min="0" />
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="p-stock">Stock (opcional)</label>
            <input type="number" id="p-stock" min="0" />
          </div>
          <div class="checkbox-row" style="align-items:flex-end; padding-bottom:0.6rem;">
            <input type="checkbox" id="p-active" checked />
            <label for="p-active" style="margin:0">Producto activo</label>
          </div>
        </div>

        <div style="display:flex; gap:0.5rem;">
          <button class="btn btn-primary" id="btn-save" type="button">Guardar producto</button>
          <button class="btn btn-outline" id="btn-cancel" type="button" style="display:none">Cancelar edición</button>
        </div>
      </div>

      <div class="card">
        <table>
          <thead>
            <tr><th>Producto</th><th>Precio</th><th>Comisión</th><th>Stock</th><th>Estado</th><th>Acciones</th></tr>
          </thead>
          <tbody id="catalog-body">
            <tr><td colspan="6" class="empty-hint">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script type="module">
    import { requireRole } from "../js/auth.js";
    import { supabase } from "../js/supabase-client.js";
    import { renderSidebar, formatMoney, showAlert, clearAlert, escapeHtml } from "../js/layout.js";

    (async () => {
      let profile;
      try {
        ({ profile } = await requireRole(["admin"]));
      } catch {
        return;
      }

      renderSidebar(profile, "catalogo");
      await loadCatalog();

      document.getElementById("btn-save").addEventListener("click", guardarProducto);
      document.getElementById("btn-cancel").addEventListener("click", limpiarFormulario);
    })();

    async function loadCatalog() {
      const tbody = document.getElementById("catalog-body");
      const { data, error } = await supabase.from("catalogo_gestor").select("*").order("name");

      if (error) {
        showAlert("alert-box", "No se pudo cargar el catálogo: " + error.message);
        return;
      }

      if (!data || !data.length) {
        tbody.innerHTML = `<tr><td colspan="6" class="empty-hint">Aún no hay productos. Crea el primero arriba.</td></tr>`;
        return;
      }

      tbody.innerHTML = data
        .map(
          (p) => `
          <tr>
            <td>${escapeHtml(p.name)}</td>
            <td>${formatMoney(p.price)}</td>
            <td>${p.commission_type === "percent" ? p.commission_value + "%" : formatMoney(p.commission_value)}</td>
            <td>${p.stock ?? "—"}</td>
            <td><span class="badge badge-${p.is_active ? "active" : "inactive"}">${p.is_active ? "Activo" : "Inactivo"}</span></td>
            <td style="display:flex; gap:0.35rem;">
              <button class="btn btn-outline btn-sm" data-edit="${p.id}" type="button">Editar</button>
              <button class="btn btn-danger btn-sm" data-delete="${p.id}" type="button">Eliminar</button>
            </td>
          </tr>`
        )
        .join("");

      tbody.querySelectorAll("[data-edit]").forEach((btn) =>
        btn.addEventListener("click", () => cargarParaEditar(data.find((p) => p.id === Number(btn.dataset.edit))))
      );
      tbody.querySelectorAll("[data-delete]").forEach((btn) =>
        btn.addEventListener("click", () => eliminarProducto(Number(btn.dataset.delete)))
      );
    }

    function cargarParaEditar(product) {
      if (!product) return;
      document.getElementById("edit-id").value = product.id;
      document.getElementById("p-name").value = product.name;
      document.getElementById("p-price").value = product.price;
      document.getElementById("p-description").value = product.description || "";
      document.getElementById("p-commission-type").value = product.commission_type;
      document.getElementById("p-commission-value").value = product.commission_value;
      document.getElementById("p-stock").value = product.stock ?? "";
      document.getElementById("p-active").checked = product.is_active;
      document.getElementById("form-title").textContent = `Editando: ${product.name}`;
      document.getElementById("btn-cancel").style.display = "inline-flex";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function limpiarFormulario() {
      document.getElementById("edit-id").value = "";
      document.getElementById("p-name").value = "";
      document.getElementById("p-price").value = "";
      document.getElementById("p-description").value = "";
      document.getElementById("p-commission-type").value = "percent";
      document.getElementById("p-commission-value").value = "";
      document.getElementById("p-stock").value = "";
      document.getElementById("p-active").checked = true;
      document.getElementById("form-title").textContent = "Nuevo producto";
      document.getElementById("btn-cancel").style.display = "none";
    }

    async function guardarProducto() {
      clearAlert("alert-box");
      const id = document.getElementById("edit-id").value;
      const name = document.getElementById("p-name").value.trim();
      const price = parseFloat(document.getElementById("p-price").value);
      const commissionValue = parseFloat(document.getElementById("p-commission-value").value);
      const stockRaw = document.getElementById("p-stock").value;

      if (!name || isNaN(price) || isNaN(commissionValue)) {
        showAlert("alert-box", "Completa nombre, precio y valor de comisión.");
        return;
      }

      const payload = {
        name,
        description: document.getElementById("p-description").value.trim(),
        price,
        commission_type: document.getElementById("p-commission-type").value,
        commission_value: commissionValue,
        stock: stockRaw === "" ? null : parseInt(stockRaw, 10),
        is_active: document.getElementById("p-active").checked,
      };

      const { error } = id
        ? await supabase.from("catalogo_gestor").update(payload).eq("id", Number(id))
        : await supabase.from("catalogo_gestor").insert(payload);

      if (error) {
        showAlert("alert-box", "No se pudo guardar: " + error.message);
        return;
      }

      showAlert("alert-box", id ? "Producto actualizado." : "Producto creado.", "success");
      limpiarFormulario();
      loadCatalog();
    }

    async function eliminarProducto(id) {
      if (!confirm("¿Eliminar este producto del catálogo? Los vales antiguos conservan el nombre y precio con el que se vendieron.")) {
        return;
      }

      const { error } = await supabase.from("catalogo_gestor").delete().eq("id", id);

      if (error) {
        showAlert("alert-box", "No se pudo eliminar (puede estar usado en vales). Desactívalo en vez de borrarlo: " + error.message);
        return;
      }

      loadCatalog();
    }
  </script>
</body>
</html>
