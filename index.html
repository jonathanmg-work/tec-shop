<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión | Sistema de Gestores</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-shell">
    <div class="login-box">
      <h1>Sistema de Gestores y Líderes</h1>
      <p class="subtitle">Inicia sesión con tu correo y contraseña.</p>

      <div id="alert-box"></div>

      <form id="login-form">
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-submit">Iniciar sesión</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { login, getSession, redirectPathForRole, getProfile } from "./js/auth.js";
    import { showAlert, clearAlert } from "./js/layout.js";

    // Si ya hay sesión activa, redirige directo a su panel.
    (async () => {
      const session = await getSession();
      if (session) {
        const profile = await getProfile(session.user.id);
        if (profile && profile.status === "active") {
          window.location.href = redirectPathForRole(profile.role);
        }
      }
    })();

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearAlert("alert-box");

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const btn = document.getElementById("btn-submit");

      btn.disabled = true;
      btn.textContent = "Entrando...";

      try {
        const { profile } = await login(email, password);
        window.location.href = redirectPathForRole(profile.role);
      } catch (err) {
        showAlert("alert-box", err.message, "error");
        btn.disabled = false;
        btn.textContent = "Iniciar sesión";
      }
    });
  </script>
</body>
</html>
